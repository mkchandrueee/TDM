<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>TIGR MVP1 — UI Prototype</title>
  <style>
    :root {
      --purple: #6428B4;
      --deep-purple: #3D176F;
      --violet: #8A42D7;
      --orange: #F28C28;
      --yellow: #F5C842;
      --cyan: #26A9E0;
      --charcoal: #292929;
      --muted: #73717A;
      --light: #F2F2F2;
      --white: #FFFFFF;
      --border: #E7E4EA;
      --green: #21845B;
      --red: #C84B55;
      --shadow: 0 10px 28px rgba(45, 27, 67, .07);
      --radius: 14px;
    }
    * { box-sizing: border-box; }
    body { margin: 0; background: #F7F6F8; color: var(--charcoal); font: 14px/1.45 Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
    button, input, select, textarea { font: inherit; }
    button { cursor: pointer; }
    .app { min-height: 100vh; display: grid; grid-template-columns: 252px minmax(0, 1fr); }
    .sidebar { background: var(--deep-purple); color: rgba(255,255,255,.83); padding: 21px 14px 16px; display: flex; flex-direction: column; min-height: 100vh; position: sticky; top: 0; height: 100vh; }
    .brand { display:flex; align-items:center; gap: 11px; padding: 0 11px 23px; border-bottom: 1px solid rgba(255,255,255,.14); }
    .brand-mark { display:grid; place-items:center; width:36px; height:36px; border-radius:11px; background:linear-gradient(145deg,var(--violet),var(--purple)); color:#fff; font-weight:800; letter-spacing:-1px; box-shadow:0 5px 14px rgba(0,0,0,.2); }
    .brand-name { font-size:18px; color:#fff; font-weight:750; letter-spacing:.3px; }
    .brand-sub { font-size:10px; opacity:.68; letter-spacing:1.05px; text-transform:uppercase; }
    .workspace-box { margin: 17px 5px 18px; padding: 10px; background: rgba(255,255,255,.09); border:1px solid rgba(255,255,255,.12); border-radius:11px; }
    .workspace-box label { display:block; font-size:10px; letter-spacing:.8px; text-transform:uppercase; opacity:.7; margin:0 0 6px 2px; }
    .workspace-box select { width:100%; color:#fff; background:transparent; border:0; outline:0; font-weight:600; }
    .workspace-box option { color:var(--charcoal); }
    .nav-label { padding: 11px 12px 7px; font-size:10px; letter-spacing:1px; text-transform:uppercase; opacity:.55; }
    .nav { display:flex; flex-direction:column; gap:3px; }
    .nav button { width:100%; text-align:left; color:inherit; border:0; background:transparent; border-radius:9px; padding:10px 11px; display:flex; align-items:center; gap:11px; transition:.16s ease; font-size:13px; }
    .nav button:hover { background:rgba(255,255,255,.1); color:#fff; }
    .nav button.active { background:#fff; color:var(--deep-purple); font-weight:700; box-shadow:0 5px 14px rgba(14,5,30,.14); }
    .nav-ico { width:20px; height:20px; display:grid; place-items:center; font-size:16px; opacity:.9; }
    .nav-count { margin-left:auto; border-radius:20px; min-width:21px; padding:1px 6px; text-align:center; background:rgba(255,255,255,.16); font-size:10px; }
    .nav button.active .nav-count { color:var(--purple); background:#F2EAFE; }
    .sidebar-bottom { margin-top:auto; padding:15px 9px 0; border-top:1px solid rgba(255,255,255,.14); font-size:11px; opacity:.7; }
    .side-user { display:flex; gap:10px; align-items:center; padding-top:14px; }
    .avatar { width:32px; height:32px; display:grid; place-items:center; border-radius:50%; background:#F5C842; color:var(--deep-purple); font-weight:800; font-size:11px; flex:none; }
    .side-user strong { display:block; color:#fff; font-size:12px; opacity:1; }
    .side-user span { display:block; font-size:10px; }
    .main { min-width:0; }
    .topbar { height:72px; padding:0 32px; display:flex; align-items:center; justify-content:space-between; background:#fff; border-bottom:1px solid var(--border); position:sticky; top:0; z-index:5; }
    .crumb { color:var(--muted); font-size:12px; }
    .crumb strong { color:var(--charcoal); font-weight:650; }
    .top-actions { display:flex; align-items:center; gap:12px; }
    .role-select { min-width:185px; height:38px; padding:0 12px; border:1px solid var(--border); border-radius:9px; background:#fff; color:var(--charcoal); font-size:12px; }
    .icon-button { border:1px solid var(--border); background:#fff; width:38px; height:38px; border-radius:10px; color:#5C5364; position:relative; }
    .notif-dot { position:absolute; right:8px; top:7px; width:7px; height:7px; border:1px solid #fff; border-radius:50%; background:var(--orange); }
    .top-avatar { width:34px; height:34px; }
    .content { max-width: 1500px; margin:0 auto; padding:28px 32px 46px; }
    .page-head { display:flex; align-items:flex-start; justify-content:space-between; gap:20px; margin-bottom:22px; }
    .eyebrow { color:var(--purple); font-size:10px; letter-spacing:1.1px; text-transform:uppercase; font-weight:750; margin-bottom:6px; }
    h1 { margin:0; font-size:26px; letter-spacing:-.7px; line-height:1.2; color:var(--charcoal); }
    .subtitle { margin:7px 0 0; color:var(--muted); font-size:13px; max-width:700px; }
    .head-actions { display:flex; gap:9px; align-items:center; flex-wrap:wrap; }
    .btn { display:inline-flex; align-items:center; justify-content:center; gap:7px; border-radius:9px; padding:9px 13px; font-size:12px; font-weight:650; border:1px solid transparent; transition:.15s ease; white-space:nowrap; }
    .btn-primary { color:#fff; background:var(--purple); box-shadow:0 4px 12px rgba(100,40,180,.17); }
    .btn-primary:hover { background:#57219F; transform:translateY(-1px); }
    .btn-secondary { color:var(--purple); background:#fff; border-color:#D9C9EF; }
    .btn-secondary:hover { background:#F7F1FE; }
    .btn-quiet { color:#5D5662; background:#fff; border-color:var(--border); }
    .btn-orange { color:#fff; background:var(--orange); }
    .btn-sm { padding:6px 9px; font-size:11px; }
    .grid { display:grid; gap:16px; }
    .stat-grid { grid-template-columns:repeat(5,minmax(0,1fr)); margin-bottom:19px; }
    .card { border:1px solid var(--border); border-radius:var(--radius); background:#fff; box-shadow:var(--shadow); }
    .stat-card { padding:16px 17px 14px; min-height:127px; position:relative; overflow:hidden; }
    .stat-top { display:flex; justify-content:space-between; align-items:center; color:var(--muted); font-size:11px; font-weight:600; }
    .stat-icon { display:grid; place-items:center; width:30px; height:30px; border-radius:9px; background:#F3ECFC; color:var(--purple); font-size:15px; }
    .stat-value { font-size:27px; line-height:1; font-weight:750; letter-spacing:-.7px; margin:14px 0 8px; }
    .stat-foot { font-size:10px; color:var(--muted); }
    .positive { color:var(--green); font-weight:650; }
    .stat-accent { position:absolute; bottom:0; left:0; right:0; height:3px; background:var(--purple); }
    .stat-card:nth-child(2) .stat-icon { background:#E9F7FC; color:#188EBF; }
    .stat-card:nth-child(2) .stat-accent { background:var(--cyan); }
    .stat-card:nth-child(3) .stat-icon { background:#FFF4E7; color:#D97A14; }
    .stat-card:nth-child(3) .stat-accent { background:var(--orange); }
    .stat-card:nth-child(4) .stat-icon { background:#FFF9DF; color:#9B7800; }
    .stat-card:nth-child(4) .stat-accent { background:var(--yellow); }
    .stat-card:nth-child(5) .stat-icon { background:#F4EEFB; color:var(--violet); }
    .stat-card:nth-child(5) .stat-accent { background:var(--violet); }
    .dashboard-grid { grid-template-columns:minmax(0,1.55fr) minmax(310px,.85fr); align-items:start; }
    .section-card { padding:18px; }
    .section-head { display:flex; justify-content:space-between; align-items:center; gap:12px; margin-bottom:15px; }
    .section-head h2 { margin:0; font-size:14px; letter-spacing:-.2px; }
    .section-head p { margin:4px 0 0; color:var(--muted); font-size:11px; }
    .text-link { border:0; background:none; color:var(--purple); font-size:11px; font-weight:700; padding:4px; }
    .text-link:hover { text-decoration:underline; }
    .activity-list { display:flex; flex-direction:column; }
    .activity { display:grid; grid-template-columns:32px minmax(0,1fr) auto; gap:11px; align-items:center; padding:12px 0; border-top:1px solid #F0EDF2; }
    .activity:first-child { border-top:0; padding-top:2px; }
    .activity-icon { width:30px; height:30px; display:grid; place-items:center; border-radius:9px; font-size:14px; background:#F3ECFC; color:var(--purple); }
    .activity-copy { min-width:0; }
    .activity-copy strong { display:block; font-size:11px; font-weight:650; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
    .activity-copy span { display:block; font-size:10px; color:var(--muted); margin-top:3px; }
    .activity-time { font-size:10px; color:#8C8790; white-space:nowrap; }
    .status { display:inline-flex; align-items:center; gap:5px; border-radius:30px; padding:4px 8px; font-size:10px; font-weight:650; white-space:nowrap; }
    .status:before { content:""; width:6px; height:6px; background:currentColor; border-radius:50%; }
    .s-ready,.s-success,.s-published { color:#21845B; background:#EAF6F0; }
    .s-running,.s-reserved { color:#187FA8; background:#E8F6FB; }
    .s-review,.s-warning { color:#B76A11; background:#FFF3E4; }
    .s-locked,.s-error { color:#B9434D; background:#FCEDEF; }
    .s-draft,.s-queued { color:#706879; background:#F1EEF4; }
    .quick-actions { display:grid; grid-template-columns:1fr 1fr; gap:10px; }
    .quick-card { text-align:left; border:1px solid var(--border); background:#fff; border-radius:11px; padding:13px; transition:.15s ease; }
    .quick-card:hover { border-color:#C7A9E8; box-shadow:0 6px 16px rgba(64,30,95,.08); transform:translateY(-1px); }
    .quick-card .qicon { display:grid; place-items:center; width:30px; height:30px; border-radius:9px; margin-bottom:10px; background:#F3ECFC; color:var(--purple); font-size:15px; }
    .quick-card strong { display:block; font-size:11px; }
    .quick-card small { display:block; color:var(--muted); font-size:10px; margin-top:4px; }
    .workspace-strip { padding:12px 15px; background:linear-gradient(105deg,#F4EDFC,#FBF8FE); border:1px solid #E8D9F6; border-radius:12px; display:flex; align-items:center; justify-content:space-between; margin-bottom:18px; gap:14px; }
    .workspace-strip strong { font-size:12px; }
    .workspace-strip span { font-size:10px; color:var(--muted); }
    .workspace-meta { display:flex; gap:17px; align-items:center; }
    .workspace-meta b { color:var(--purple); font-size:12px; }
    .role-note { color:#655774; font-size:10px; padding:7px 9px; background:#fff; border:1px solid #E7D8F5; border-radius:8px; }
    .table-card { overflow:hidden; }
    .table-toolbar { padding:15px 17px; display:flex; gap:10px; align-items:center; justify-content:space-between; border-bottom:1px solid var(--border); }
    .search { width:min(320px,100%); height:36px; border:1px solid var(--border); border-radius:8px; padding:0 11px 0 34px; background:#fff; outline:none; font-size:11px; color:var(--charcoal); }
    .search:focus,.field input:focus,.field select:focus,.field textarea:focus { border-color:#B895DF; box-shadow:0 0 0 3px rgba(100,40,180,.08); }
    .search-wrap { position:relative; }
    .search-wrap:before { content:"⌕"; position:absolute; left:12px; top:5px; color:#817988; font-size:18px; }
    .table-wrap { overflow:auto; }
    table { width:100%; border-collapse:collapse; min-width:720px; }
    th { padding:11px 15px; background:#FAF9FB; color:#77717D; text-align:left; text-transform:uppercase; letter-spacing:.65px; font-size:9px; font-weight:700; }
    td { padding:12px 15px; border-top:1px solid #F0EDF2; font-size:11px; vertical-align:middle; }
    td strong { font-size:11px; font-weight:650; }
    .muted { color:var(--muted); font-size:10px; }
    .table-actions { display:flex; gap:6px; align-items:center; }
    .inline-link { color:var(--purple); border:0; background:none; padding:3px; font-size:10px; font-weight:700; }
    .stepper { display:flex; gap:0; margin:18px 0 20px; align-items:center; }
    .step { display:flex; align-items:center; gap:8px; color:#98929C; font-size:11px; font-weight:600; }
    .step:not(:last-child):after { content:""; width:42px; height:1px; background:#DDD7E3; margin:0 12px; }
    .step-num { width:24px; height:24px; border-radius:50%; display:grid; place-items:center; border:1px solid #D6CFDD; background:#fff; font-size:10px; }
    .step.active { color:var(--purple); }
    .step.active .step-num { color:#fff; border-color:var(--purple); background:var(--purple); }
    .step.done { color:var(--green); }
    .step.done .step-num { color:var(--green); border-color:#B9E0CC; background:#EAF6F0; }
    .form-layout { display:grid; grid-template-columns:minmax(0,1.45fr) minmax(260px,.7fr); gap:17px; align-items:start; }
    .form-card { padding:20px; }
    .form-card h2 { margin:0 0 5px; font-size:14px; }
    .form-card .hint { margin:0 0 18px; color:var(--muted); font-size:11px; }
    .field { margin-bottom:15px; }
    .field label { display:block; margin-bottom:6px; font-size:11px; font-weight:650; }
    .field label em { font-style:normal; color:var(--red); }
    .field input,.field select,.field textarea { width:100%; border:1px solid var(--border); border-radius:8px; background:#fff; padding:10px 11px; outline:none; font-size:11px; color:var(--charcoal); }
    .field textarea { min-height:104px; resize:vertical; }
    .field .help { display:block; margin-top:5px; color:var(--muted); font-size:10px; }
    .choice-row { display:flex; gap:9px; flex-wrap:wrap; }
    .choice { flex:1; min-width:180px; border:1px solid var(--border); border-radius:10px; padding:12px; background:#fff; }
    .choice.selected { border-color:var(--purple); background:#FBF8FE; box-shadow:0 0 0 2px rgba(100,40,180,.06); }
    .choice strong { display:block; font-size:11px; margin-bottom:4px; }
    .choice span { display:block; color:var(--muted); font-size:10px; }
    .choice input { accent-color:var(--purple); margin-right:6px; }
    .side-info { padding:17px; }
    .side-info h3 { font-size:12px; margin:0 0 11px; }
    .info-row { padding:10px 0; border-top:1px solid #F0EDF2; display:flex; justify-content:space-between; gap:12px; font-size:10px; }
    .info-row span { color:var(--muted); }
    .info-row strong { text-align:right; }
    .callout { border-radius:10px; padding:12px; background:#FFF8E8; color:#72521A; font-size:10px; border:1px solid #F5E4B5; margin-top:12px; }
    .callout.purple { background:#F7F1FE; border-color:#E9DCF7; color:#57388A; }
    .source-list { display:flex; flex-direction:column; gap:8px; }
    .source-row { display:flex; align-items:center; gap:10px; padding:10px; border:1px solid #EEEAF1; border-radius:9px; }
    .db-icon { width:30px; height:30px; border-radius:8px; display:grid; place-items:center; color:#177FA8; background:#E9F7FC; font-size:14px; }
    .source-row strong { display:block; font-size:11px; }
    .source-row small { display:block; color:var(--muted); font-size:9px; margin-top:2px; }
    .source-row .status { margin-left:auto; }
    .field-tags { display:flex; gap:6px; flex-wrap:wrap; }
    .tag { background:#F3EFF7; border:1px solid #E8E0EF; padding:5px 8px; border-radius:7px; font-size:10px; color:#5E4B73; }
    .tag.selected { background:#F2EAFE; border-color:#D6BDED; color:var(--purple); font-weight:650; }
    .progress { height:7px; background:#EEEAF2; border-radius:10px; overflow:hidden; }
    .progress span { display:block; height:100%; background:var(--purple); border-radius:10px; }
    .empty { padding:38px 20px; text-align:center; color:var(--muted); font-size:12px; }
    .audit-filter { display:flex; align-items:center; gap:8px; flex-wrap:wrap; }
    .audit-filter select { border:1px solid var(--border); border-radius:8px; padding:8px 10px; color:var(--charcoal); background:#fff; font-size:10px; }
    .notice { padding:12px 14px; border:1px solid #D7EAF4; background:#F2FAFD; border-radius:10px; color:#31647B; font-size:10px; margin-bottom:15px; }
    .toast { position:fixed; bottom:22px; right:24px; z-index:20; padding:12px 16px; background:#29202F; color:#fff; border-radius:10px; box-shadow:0 10px 30px rgba(0,0,0,.22); font-size:12px; opacity:0; transform:translateY(12px); transition:.22s ease; pointer-events:none; }
    .toast.show { opacity:1; transform:translateY(0); }
    .modal-backdrop { position:fixed; inset:0; z-index:30; display:grid; place-items:center; padding:20px; background:rgba(25,13,37,.48); backdrop-filter:blur(3px); }
    .modal { width:min(760px,100%); max-height:min(88vh,900px); overflow:auto; background:#fff; border-radius:16px; border:1px solid rgba(255,255,255,.6); box-shadow:0 24px 80px rgba(25,13,37,.3); animation:modalIn .16s ease-out; }
    @keyframes modalIn { from { opacity:0; transform:translateY(8px) scale(.99); } to { opacity:1; transform:none; } }
    .modal-head { display:flex; align-items:flex-start; justify-content:space-between; gap:16px; padding:19px 21px 15px; border-bottom:1px solid var(--border); }
    .modal-head h2 { margin:0; font-size:17px; letter-spacing:-.3px; }
    .modal-head p { margin:5px 0 0; font-size:11px; color:var(--muted); }
    .modal-close { width:32px; height:32px; border:1px solid var(--border); border-radius:8px; background:#fff; color:#6C6572; font-size:17px; }
    .modal-body { padding:19px 21px; }
    .modal-foot { padding:13px 21px; display:flex; justify-content:flex-end; gap:8px; border-top:1px solid var(--border); background:#FCFBFD; border-radius:0 0 16px 16px; }
    .modal-tabs { display:flex; gap:5px; border-bottom:1px solid var(--border); margin:-2px 0 16px; }
    .modal-tabs button { border:0; background:none; padding:9px 11px; color:#746D79; font-size:11px; font-weight:650; border-bottom:2px solid transparent; }
    .modal-tabs button.active { color:var(--purple); border-color:var(--purple); }
    .lineage-track { position:relative; margin:8px 0 4px 10px; padding-left:25px; }
    .lineage-track:before { content:""; position:absolute; left:6px; top:13px; bottom:18px; width:2px; background:#E2D5EF; }
    .lineage-node { position:relative; padding:0 0 17px; }
    .lineage-node:last-child { padding-bottom:0; }
    .lineage-node:before { content:""; position:absolute; left:-24px; top:4px; width:12px; height:12px; border-radius:50%; background:var(--purple); border:3px solid #F0E7FA; box-shadow:0 0 0 1px #D4BCEB; }
    .lineage-node strong { display:block; font-size:11px; }
    .lineage-node span { display:block; margin-top:3px; color:var(--muted); font-size:10px; }
    .modal-grid { display:grid; grid-template-columns:1fr 1fr; gap:12px; }
    .modal-summary { border:1px solid #EEEAF1; border-radius:10px; padding:12px; }
    .modal-summary small { display:block; color:var(--muted); font-size:9px; text-transform:uppercase; letter-spacing:.6px; }
    .modal-summary strong { display:block; margin-top:4px; font-size:11px; }
    .workflow-subnav { display:flex; align-items:center; gap:7px; margin:0 0 17px; overflow:auto; padding-bottom:3px; }
    .workflow-subnav button { display:flex; align-items:center; gap:7px; flex:none; padding:7px 10px; border-radius:20px; border:1px solid var(--border); background:#fff; color:#766F7A; font-size:10px; }
    .workflow-subnav button.active { color:var(--purple); border-color:#D8C3EE; background:#F7F1FE; font-weight:700; }
    .workflow-subnav button.done { color:var(--green); border-color:#CBE6D8; }
    .substep-num { display:grid; place-items:center; width:18px; height:18px; border-radius:50%; background:#F1EDF4; font-size:9px; }
    .workflow-subnav button.active .substep-num { color:#fff; background:var(--purple); }
    @media (max-width:620px) { .modal-backdrop { padding:10px; align-items:end; } .modal { max-height:92vh; border-radius:15px 15px 10px 10px; } .modal-grid { grid-template-columns:1fr; } .modal-head,.modal-body { padding-left:16px; padding-right:16px; } }
    .mobile-menu { display:none; }
    @media (max-width: 1120px) { .stat-grid { grid-template-columns:repeat(3,1fr); } .dashboard-grid { grid-template-columns:1fr; } }
    @media (max-width: 820px) { .app { grid-template-columns:1fr; } .sidebar { position:fixed; z-index:12; width:252px; left:-260px; transition:.2s; box-shadow:10px 0 30px rgba(0,0,0,.2); } .sidebar.open { left:0; } .topbar { padding:0 17px; height:62px; } .content { padding:22px 17px 36px; } .mobile-menu { display:inline-grid; place-items:center; margin-right:10px; border:1px solid var(--border); width:35px; height:35px; border-radius:8px; background:#fff; } .crumb-wrap { display:flex; align-items:center; } .role-select { min-width:130px; max-width:155px; } }
    @media (max-width: 620px) { .stat-grid { grid-template-columns:repeat(2,1fr); gap:10px; } .stat-card { min-height:115px; padding:13px; } .stat-value { font-size:23px; } .page-head { display:block; } .head-actions { margin-top:14px; } h1 { font-size:22px; } .top-actions { gap:6px; } .top-avatar { display:none; } .role-select { min-width:122px; } .workspace-strip { align-items:flex-start; flex-direction:column; } .workspace-meta { gap:12px; flex-wrap:wrap; } .form-layout { grid-template-columns:1fr; } .step:not(:last-child):after { width:14px; margin:0 5px; } .step { font-size:9px; gap:5px; } .step-num { width:21px; height:21px; } .table-toolbar { align-items:flex-start; flex-direction:column; } .search { width:100%; } }
  </style>
</head>
<body>
<div class="app">
  <aside class="sidebar" id="sidebar">

        <select class="role-select" id="roleSelect" aria-label="Preview role"><option>Test Data Engineer</option><option>QA Engineer</option><option>Admin</option></select>

<script>
  const activityData = [
    {user:'Aditi Menon',role:'Test Data Engineer',initials:'AM',icon:'✦',title:'Published data set · Retail customer onboarding',detail:'DS-1048 · Version 3 · 2,400 records',time:'8 min ago',status:'Published'},
    {user:'Rohan Iyer',role:'QA Engineer',initials:'RI',icon:'◷',title:'Reserved data set · Card dispute regression',detail:'DS-1037 · Reservation through 18 Oct',time:'21 min ago',status:'Reserved'},
    {user:'Aditi Menon',role:'Test Data Engineer',initials:'AM',icon:'◈',title:'Masking validation completed',detail:'Retail customer onboarding · 14 fields checked',time:'46 min ago',status:'Success'},
    {user:'Neha Shah',role:'QA Engineer',initials:'NS',icon:'▣',title:'Released lock · Payments reversal pack',detail:'DS-1009 · Lock lease closed',time:'1 hr ago',status:'Success'},
    {user:'Aditi Menon',role:'Test Data Engineer',initials:'AM',icon:'⛁',title:'Connection test passed · CoreBank UAT',detail:'PostgreSQL · Source connection',time:'2 hrs ago',status:'Success'},
    {user:'Rohan Iyer',role:'QA Engineer',initials:'RI',icon:'⇩',title:'Downloaded data set · Loan delinquency',detail:'DS-0986 · Masked CSV export',time:'3 hrs ago',status:'Success'},
    {user:'Maya Rao',role:'Admin',initials:'MR',icon:'♙',title:'Granted workspace access · Rohan Iyer',detail:'QA Engineer · Valid until 31 Oct 2026',time:'4 hrs ago',status:'Success'}
  ];
  const datasets = [
    ['DS-1048','Retail customer onboarding','Scenario-assisted','v3','2,400','Published','Aditi Menon','Today, 10:42'],
    ['DS-1037','Card dispute regression','Source to Data','v2','850','Published','Aditi Menon','Today, 09:16'],
    ['DS-1026','Loan delinquency — 30 day','Scenario-assisted','v1','1,200','Published','Dev Nair','Yesterday'],
    ['DS-1009','Payments reversal pack','Source to Data','v4','3,500','Published','Aditi Menon','Yesterday'],
    ['DS-0992','Savings account edge cases','Scenario-assisted','v1','—','In review','Aditi Menon','07 Oct 2026'],
    ['DS-0986','Loan delinquency — masked','Source to Data','v2','5,000','Published','Dev Nair','06 Oct 2026']
  ];
  const pages = {
    dashboard: {title:'Dashboard',eyebrow:'Workspace overview',sub:'A role-aware view of data sets, jobs, connections and test usage.'},
    datasets: {title:'Data sets',eyebrow:'Data catalogue',sub:'Browse governed, versioned data sets created in this workspace.'},
    scenario: {title:'Scenario to Data Generation',eyebrow:'Create a data set · AI-assisted',sub:'Describe a test need, review the schema mapping, then generate source-backed or synthetic data.'},
    fieldmap: {title:'Source to Data',eyebrow:'Create a data set · approved source and mapping',sub:'Choose a saved mapping and required fields to build a validated data set.'},
    connections: {title:'Source & Target Connections',eyebrow:'Workspace setup',sub:'Configure, test and save approved connections for data generation and delivery.'},
    masking: {title:'PII Discovery & Masking',eyebrow:'Privacy controls',sub:'Review sensitive-field findings, apply a masking policy and validate the result.'},
    reservations: {title:'Reservations & Locks',eyebrow:'Test data usage',sub:'Plan future use and prevent conflicting use while a data set is in execution.'},
    jobs: {title:'Jobs',eyebrow:'Processing activity',sub:'Monitor generation, masking, validation and provisioning jobs.'},
    access: {title:'Access & Roles',eyebrow:'Platform administration',sub:'Manage workspace memberships and time-bound access to TIGR resources.'},
    audit: {title:'Activities & Audit',eyebrow:'Traceability',sub:'Review user and job activity using role-based visibility and searchable evidence.'}
  };
  let currentPage='dashboard';
  let currentRole='Test Data Engineer';
  let toastTimer;
  function esc(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}
  function statusClass(s){return ({Published:'s-published',Success:'s-success',Reserved:'s-reserved','In review':'s-review',Running:'s-running',Queued:'s-queued',Locked:'s-locked',Failed:'s-error',Draft:'s-draft',Ready:'s-ready'})[s]||'s-draft';}
  function visibleActivities(){if(currentRole==='Admin') return activityData; if(currentRole==='Test Data Engineer') return activityData.filter(a=>a.user==='Aditi Menon'||a.role==='QA Engineer'); return activityData.filter(a=>a.role==='QA Engineer'&&a.user==='Rohan Iyer');}
  function roleGreeting(){return currentRole==='Admin'?'Platform-wide oversight':currentRole==='QA Engineer'?'Your testing activity':'Your work and QA usage';}
  function activityRows(items){return `<div class="activity-list">${items.slice(0,6).map(a=>`<div class="activity"><div class="activity-icon">${a.icon}</div><div class="activity-copy"><strong>${esc(a.title)}</strong><span>${esc(a.user)} · ${esc(a.detail)}</span></div><div class="activity-time">${esc(a.time)}</div></div>`).join('')||'<div class="empty">No activity available for this view.</div>'}</div>`;}
  function stat(label,value,foot,icon){return `<div class="card stat-card"><div class="stat-top"><span>${label}</span><span class="stat-icon">${icon}</span></div><div class="stat-value">${value}</div><div class="stat-foot">${foot}</div><div class="stat-accent"></div></div>`;}
  function dashboard(){
    const acts=visibleActivities();
    const quicks=currentRole==='QA Engineer'
      ? `<button class="quick-card" onclick="goTo('datasets')"><span class="qicon">▤</span><strong>Find a data set</strong><small>Browse published data</small></button><button class="quick-card" onclick="openModal('reserve')"><span class="qicon">◷</span><strong>Reserve data</strong><small>Plan an upcoming test</small></button>`
      : currentRole==='Admin'
      ? `<button class="quick-card" onclick="openModal('workspace')"><span class="qicon">＋</span><strong>Create workspace</strong><small>Set up a new team space</small></button><button class="quick-card" onclick="openModal('grant')"><span class="qicon">♙</span><strong>Grant access</strong><small>Set a resource and time limit</small></button><button class="quick-card" onclick="goTo('audit')"><span class="qicon">☷</span><strong>Review activity</strong><small>See all TIGR activity</small></button><button class="quick-card" onclick="goTo('access')"><span class="qicon">▦</span><strong>Manage access</strong><small>Review users and workspaces</small></button>`
      : `<button class="quick-card" onclick="goTo('scenario')"><span class="qicon">✦</span><strong>Scenario generation</strong><small>Describe the data you need</small></button><button class="quick-card" onclick="goTo('fieldmap')"><span class="qicon">⌘</span><strong>Source to Data</strong><small>Select a source, mapping and fields</small></button><button class="quick-card" onclick="goTo('connections')"><span class="qicon">⛁</span><strong>Set up connection</strong><small>Test and save a source</small></button><button class="quick-card" onclick="goTo('reservations')"><span class="qicon">◷</span><strong>Reserve data</strong><small>Plan an upcoming test</small></button>`;
    return `<div class="page-head"><div><div class="eyebrow">${pages.dashboard.eyebrow}</div><h1>Good afternoon, ${currentRole==='QA Engineer'?'Rohan':currentRole==='Admin'?'Maya':'Aditi'}</h1><p class="subtitle">${roleGreeting()} in <strong>Retail Banking QA</strong>. Here’s what needs your attention today.</p></div><div class="head-actions"><button class="btn btn-secondary" onclick="notify('Dashboard refreshed')">↻ &nbsp;Refresh</button>${currentRole==='QA Engineer'?'<button class="btn btn-primary" onclick="goTo(\'datasets\')">＋ &nbsp;Find data</button>':currentRole==='Admin'?'<button class="btn btn-primary" onclick="openModal(\'workspace\')">＋ &nbsp;Create workspace</button>':'<button class="btn btn-primary" onclick="goTo(\'scenario\')">＋ &nbsp;Create data set</button>'}</div></div>
      <div class="workspace-strip"><div><strong>Retail Banking QA</strong><br><span>Workspace · 12 members · Last updated just now</span></div><div class="workspace-meta"><span>Connected sources <b>8</b></span><span>Data sets <b>24</b></span><span class="role-note">Viewing as ${esc(currentRole)}</span></div></div>
      <div class="grid stat-grid">${stat('Published data sets','24','3 added this week','▤')}${stat('Active jobs','3','2 running · 1 queued','↻')}${stat('Reservations','6','2 starting today','◷')}${stat('Active locks','2','All within lease window','⌑')}${stat('Source connections','8','7 healthy · 1 needs review','⛁')}</div>
      <div class="grid dashboard-grid">
        <div class="card section-card"><div class="section-head"><div><h2>Recent activity</h2><p>${currentRole==='Admin'?'All TIGR activity':currentRole==='Test Data Engineer'?'Your activity and QA Engineer activity':'Your activity only'}</p></div><button class="text-link" onclick="goTo('audit')">View activity →</button></div>${activityRows(acts)}</div>
        <div class="card section-card"><div class="section-head"><div><h2>Quick actions</h2><p>Start a common task</p></div></div><div class="quick-actions">${quicks}</div><div class="callout purple" style="margin-top:13px"><strong>Data set is the primary unit</strong><br>Both creation paths produce a versioned data set with validation, lineage and access controls.</div></div>
      </div>`;
  }
  function datasetTable(rows=datasets){
    const action=currentRole==='QA Engineer'?`<button class="btn btn-primary btn-sm" onclick="goTo('reservations')">＋ Reserve data</button>`:currentRole==='Test Data Engineer'?`<button class="btn btn-primary btn-sm" onclick="goTo('scenario')">＋ Create data set</button>`:'';
    return `<div class="card table-card"><div class="table-toolbar"><div class="search-wrap"><input class="search" id="tableSearch" placeholder="Search data sets by name or ID…" oninput="filterTable()" /></div><div class="head-actions"><select class="role-select" style="height:36px;min-width:125px" onchange="filterStatus(this.value)"><option value="">All statuses</option><option>Published</option><option>In review</option></select>${action}</div></div><div class="table-wrap"><table id="dataTable"><thead><tr><th>Data set</th><th>Creation path</th><th>Version</th><th>Records</th><th>Status</th><th>Owner</th><th>Updated</th><th></th></tr></thead><tbody>${rows.map(d=>`<tr data-status="${d[5]}" data-search="${(d[0]+' '+d[1]+' '+d[2]).toLowerCase()}"><td><strong>${d[1]}</strong><div class="muted">${d[0]}</div></td><td>${d[2]}</td><td>${d[3]}</td><td>${d[4]}</td><td><span class="status ${statusClass(d[5])}">${d[5]}</span></td><td>${d[6]}</td><td class="muted">${d[7]}</td><td><button class="inline-link" onclick="openDataset('${d[0]}','lineage')">Lineage</button></td></tr>`).join('')}</tbody></table></div></div>`;
  }
  function datasetsPage(){const visible=currentRole==='QA Engineer'?datasets.filter(d=>d[5]==='Published'):datasets;return `<div class="page-head"><div><div class="eyebrow">${pages.datasets.eyebrow}</div><h1>${pages.datasets.title}</h1><p class="subtitle">${pages.datasets.sub}</p></div><div class="head-actions">${currentRole==='QA Engineer'?'<button class="btn btn-primary" onclick="goTo(\'reservations\')">＋ Reserve data set</button>':currentRole==='Test Data Engineer'?'<button class="btn btn-primary" onclick="goTo(\'scenario\')">＋ Create data set</button>':''}</div></div><div class="notice">Published data sets appear in the common catalogue when your workspace and data-set permissions allow access. QA Engineers see only authorized published versions. Draft and review versions are restricted to authorized creators and reviewers.</div>${datasetTable(visible)}</div>`;}
  let scenarioStep=0, sourceStep=0;
  function subnav(labels,index,setter){return `<div class="workflow-subnav">${labels.map((l,i)=>`<button class="${i===index?'active':i<index?'done':''}" onclick="${setter}(${i})"><span class="substep-num">${i<index?'✓':i+1}</span>${l}</button>`).join('')}</div>`;}
  function setScenarioStep(n){scenarioStep=Math.max(0,Math.min(3,n));render();}
  function setSourceStep(n){sourceStep=Math.max(0,Math.min(3,n));render();}
  function scenarioPage(){
    const labels=['Text requirement','Schema mapping','Query development','Data generation'];
    let body='';
    if(scenarioStep===0) body=`<div class="field"><label>Scenario requirement <em>*</em></label><textarea placeholder="Example: Create a retail customer with an active savings account, an available balance above $1,000, and a recent debit-card refund. Include the customer, account and transaction records needed for regression testing."></textarea><span class="help">Avoid entering real customer details or sensitive production values.</span></div><div class="grid" style="grid-template-columns:1fr 1fr"><div class="field"><label>Application / domain</label><select><option>Retail Banking</option><option>Payments</option><option>Lending</option></select></div><div class="field"><label>Data volume</label><select><option>Small · 1–100 records</option><option>Medium · 101–5,000 records</option><option>Large · 5,001+ records</option></select></div></div><div class="field"><label>Approved workspace sources</label><div class="source-list"><div class="source-row"><div class="db-icon">⛁</div><div><strong>CoreBank UAT</strong><small>PostgreSQL · 12 tables · tested today</small></div><span class="status s-ready">Available</span></div><div class="source-row"><div class="db-icon">▧</div><div><strong>Customer Events</strong><small>JSON files · 4 structures · tested yesterday</small></div><span class="status s-ready">Available</span></div></div></div>`;
    if(scenarioStep===1) body=`<div class="notice">TIGR proposes schema matches from approved workspace metadata. Review and correct the mapping before continuing.</div><div class="table-wrap"><table style="min-width:540px"><thead><tr><th>Scenario concept</th><th>Mapped entity / field</th><th>Relationship</th><th>Confidence</th></tr></thead><tbody><tr><td>Retail customer</td><td><select><option>Customer.customer_id</option><option>Party.party_id</option></select></td><td>Primary entity</td><td><span class="status s-ready">96%</span></td></tr><tr><td>Active savings account</td><td><select><option>Account.account_type + status</option></select></td><td>Customer → Account</td><td><span class="status s-ready">93%</span></td></tr><tr><td>Available balance &gt; 1,000</td><td><select><option>Account.available_balance</option></select></td><td>Account</td><td><span class="status s-ready">98%</span></td></tr><tr><td>Recent debit-card refund</td><td><select><option>Transaction.type + date</option></select></td><td>Account → Transaction</td><td><span class="status s-review">Review</span></td></tr></tbody></table></div><div class="callout purple">Source and field access is checked against the active workspace before these mappings can be used.</div>`;
    if(scenarioStep===2) body=`<div class="notice">Read-only query plan · parameterized · 2 joins · capped preview · user confirmation required before extraction.</div><div class="field"><label>Logical query plan</label><textarea readonly style="min-height:110px;background:#FAF9FB">Customer → Account (customer_id) → Transaction (account_id)\nFilters: account_status = :active_status\navailable_balance &gt; :minimum_balance\ntransaction_type = :refund_type AND transaction_date &gt;= :window_start</textarea></div><div class="grid" style="grid-template-columns:1fr 1fr"><div class="modal-summary"><small>Estimated matching records</small><strong>~ 1,840 customers</strong></div><div class="modal-summary"><small>Preview</small><strong>Protected · 20 rows max</strong></div></div><div class="callout">Sensitive preview values are masked. No query runs until you approve the plan and source scope.</div>`;
    if(scenarioStep===3) body=`<div class="field"><label>Data creation mode</label><div class="choice-row"><label class="choice selected"><strong><input type="radio" name="mode" checked>Source-backed</strong><span>Retrieve a matching subset from approved workspace sources.</span></label><label class="choice"><strong><input type="radio" name="mode">GenAI synthetic</strong><span>Generate synthetic records from approved schema and scenario constraints.</span></label></div></div><div class="grid" style="grid-template-columns:1fr 1fr"><div class="field"><label>Requested records</label><input value="500" /></div><div class="field"><label>Output target</label><select><option>Secure file · CSV</option><option>CoreBank QA database</option></select></div></div><div class="modal-grid"><div class="modal-summary"><small>Data set status</small><strong>Draft until validation passes</strong></div><div class="modal-summary"><small>Lineage</small><strong>Scenario → schema → job → validation</strong></div></div><div class="callout purple">TIGR records the approved schema/scenario, query or model configuration, job, masking, validation, publication and delivery in the data-set lineage.</div>`;
    const button=scenarioStep<3?`<button class="btn btn-primary" onclick="${scenarioStep===0?"notify('Scenario analysed. Review the proposed schema mapping.');setScenarioStep(1)":`setScenarioStep(${scenarioStep+1})`}">Continue →</button>`:`<button class="btn btn-primary" onclick="notify('Generation job submitted. Data set created as draft.');closeModal();goTo('datasets')">Generate draft data set</button>`;
    return `<div class="page-head"><div><div class="eyebrow">${pages.scenario.eyebrow}</div><h1>${pages.scenario.title}</h1><p class="subtitle">${pages.scenario.sub}</p></div><div class="head-actions"><button class="btn btn-quiet" onclick="notify('Draft saved')">Save draft</button></div></div>${subnav(labels,scenarioStep,'setScenarioStep')}<div class="form-layout"><div class="card form-card"><h2>${labels[scenarioStep]}</h2><p class="hint">${scenarioStep===0?'Describe the data need. TIGR will propose a reviewable plan.':scenarioStep===1?'Review how scenario concepts map to approved workspace schema.':scenarioStep===2?'Inspect the safe, read-only query plan before source retrieval.':'Choose generation mode and submit a draft data set.'}</p>${body}<div style="display:flex;justify-content:space-between;gap:10px;margin-top:20px"><button class="btn btn-quiet" ${scenarioStep===0?'disabled':''} onclick="setScenarioStep(${scenarioStep-1})">← Back</button>${button}</div></div><div class="card side-info"><h3>Workspace context</h3><div class="info-row"><span>Workspace</span><strong>Retail Banking QA</strong></div><div class="info-row"><span>Enabled sources</span><strong>8 connections</strong></div><div class="info-row"><span>Data set owner</span><strong>Aditi Menon</strong></div><div class="info-row"><span>Privacy gate</span><strong>Required before publish</strong></div><div class="callout purple">AI proposes mappings and values. A Test Data Engineer reviews the plan; TIGR does not publish unvalidated output.</div></div></div>`;
  }
  function sourceToDataPage(){
    const labels=['Select source','Map fields','Generate data','Validate & publish'];
    let body='';
    if(sourceStep===0) body=`<div class="field"><label>Source connection <em>*</em></label><select><option>CoreBank UAT · PostgreSQL · Healthy</option><option>Payments QA · Oracle · Healthy</option><option>Customer Events · JSON · Healthy</option></select></div><div class="field"><label>Saved mapping</label><select><option>Retail Customer + Account v4</option><option>Card Transaction + Dispute v2</option><option>Loan + Repayment v3</option></select></div><div class="grid" style="grid-template-columns:1fr 1fr"><div class="modal-summary"><small>Connection test</small><strong style="color:var(--green)">Passed · 10:40 today</strong></div><div class="modal-summary"><small>Schema version</small><strong>CoreBank UAT · v18</strong></div></div><div class="callout purple">Choose an approved, enabled workspace source. The mapping is versioned so lineage can trace the fields to their origin.</div>`;
    if(sourceStep===1) body=`<div class="notice">Select required fields from the saved mapping. Mandatory keys and relationship fields are included to preserve referential integrity.</div><div class="field"><label>Entities & required fields</label><div style="padding:12px;border:1px solid var(--border);border-radius:9px;margin-bottom:9px"><strong style="font-size:11px">Customer</strong><div class="field-tags" style="margin-top:9px"><span class="tag selected">✓ customer_id</span><span class="tag selected">✓ customer_status</span><span class="tag selected">✓ full_name · masked</span><span class="tag">date_of_birth · shifted</span><span class="tag">email · tokenized</span></div></div><div style="padding:12px;border:1px solid var(--border);border-radius:9px;margin-bottom:9px"><strong style="font-size:11px">Account</strong><div class="field-tags" style="margin-top:9px"><span class="tag selected">✓ account_id</span><span class="tag selected">✓ account_type</span><span class="tag selected">✓ available_balance</span><span class="tag">currency_code</span></div></div><div style="padding:12px;border:1px solid var(--border);border-radius:9px"><strong style="font-size:11px">Transaction</strong><div class="field-tags" style="margin-top:9px"><span class="tag">transaction_id</span><span class="tag">transaction_type</span><span class="tag">transaction_date</span><span class="tag">amount</span></div></div></div><div class="info-row"><span>Selected required fields</span><strong>5 fields · 2 relationships</strong></div>`;
    if(sourceStep===2) body=`<div class="grid" style="grid-template-columns:1fr 1fr"><div class="field"><label>Generation criteria</label><input value="Active accounts with balance greater than 1,000" /></div><div class="field"><label>Record count</label><input value="500" /></div></div><div class="field"><label>Output target</label><select><option>Secure file · CSV</option><option>CoreBank QA database</option><option>Payments QA · Oracle</option></select></div><div class="field"><label>Protected sample preview</label><div class="table-wrap"><table style="min-width:450px"><thead><tr><th>customer_id</th><th>customer_status</th><th>account_id</th><th>available_balance</th></tr></thead><tbody><tr><td>C•••184</td><td>Active</td><td>A•••921</td><td>1,240.00</td></tr><tr><td>C•••637</td><td>Active</td><td>A•••482</td><td>2,015.50</td></tr></tbody></table></div></div><div class="callout">Preview values are protected. Source extraction runs only after authorized confirmation.</div>`;
    if(sourceStep===3) body=`<div class="grid" style="grid-template-columns:1fr 1fr"><div class="modal-summary"><small>Schema & fields</small><strong style="color:var(--green)">Passed · 5 of 5 required</strong></div><div class="modal-summary"><small>Relationships</small><strong style="color:var(--green)">Passed · 2 links</strong></div><div class="modal-summary"><small>Masking</small><strong style="color:var(--green)">Passed · 3 sensitive fields</strong></div><div class="modal-summary"><small>Target validation</small><strong style="color:var(--green)">Passed</strong></div></div><div class="callout purple">Lineage will record: CoreBank UAT → schema v18 → mapping v4 → selected fields → Source to Data job → masking policy → validation → data-set version → target.</div><div class="field"><label>Data set name</label><input value="Retail customer balance test pack" /></div>`;
    const button=sourceStep<3?`<button class="btn btn-primary" onclick="${sourceStep===0?"setSourceStep(1)":`setSourceStep(${sourceStep+1})`}">Continue →</button>`:`<button class="btn btn-primary" onclick="openModal('publish')">Validate & publish data set</button>`;

      reserve:{title:'Reserve data set',sub:`Request a future use window for ${id||'the selected data set'}.`,body:`<div class="field"><label>Data set</label><input value="${esc(id||'Choose a published data set')}" readonly /></div><div class="field"><label>Test purpose <em>*</em></label><input placeholder="e.g., October card dispute regression" /></div><div class="grid" style="grid-template-columns:1fr 1fr"><div class="field"><label>Start</label><input type="date" value="2026-10-12" /></div><div class="field"><label>End</label><input type="date" value="2026-10-18" /></div></div><div class="field"><label>Automation suite (optional)</label><input placeholder="Suite or execution reference" /></div><div class="callout purple">Reservation secures a planned window. Acquire a lock when execution begins.</div>`,action:'Submit reservation',done:'Reservation submitted'},
      lock:{title:'Reservation & lock details',sub:`Current usage controls for ${id||'the selected data set'}.`,body:`<div class="modal-grid"><div class="modal-summary"><small>Reservation</small><strong>Rohan Iyer · through 18 Oct 2026</strong></div><div class="modal-summary"><small>Lock status</small><strong style="color:var(--orange)">Available to acquire</strong></div></div><div class="field" style="margin-top:14px"><label>Test run reference</label><input placeholder="e.g., REG-2026-10-14" /></div><div class="field"><label>Lock lease</label><select><option>4 hours</option><option>8 hours</option><option>Custom duration</option></select></div><div class="callout purple">A lock prevents conflicting TIGR-mediated use while the test is running. The lease expires automatically unless renewed.</div>`,action:'Acquire lock',done:'Exclusive lock acquired'},
      grant:{title:'Grant time-bound access',sub:'Choose a user, resource scope and validity period.',body:`<div class="grid" style="grid-template-columns:1fr 1fr"><div class="field"><label>User</label><select><option>Choose a bank user…</option><option>Rohan Iyer</option><option>Neha Shah</option></select></div><div class="field"><label>Role</label><select><option>QA Engineer</option><option>Test Data Engineer</option><option>Admin</option></select></div></div><div class="field"><label>Workspace</label><select><option>Retail Banking QA</option><option>Payments Modernization</option></select></div><div class="field"><label>Resource scope</label><select><option>Workspace</option><option>Specific data set</option><option>Reservation or lock</option></select></div><div class="grid" style="grid-template-columns:1fr 1fr"><div class="field"><label>Valid from</label><input type="date" value="2026-10-07" /></div><div class="field"><label>Valid until</label><input type="date" value="2026-10-31" /></div></div><div class="field"><label>Reason</label><input placeholder="Business reason for access" /></div>`,action:'Grant access',done:'Time-bound access granted'},
      policy:{title:'Upload masking policy',sub:'Add a policy file for review before it can be enforced.',body:`<div class="field"><label>Policy name</label><input placeholder="e.g., Customer PII baseline v4" /></div><div class="field"><label>Policy file</label><input type="file" accept=".csv,.json,.yaml,.yml,.pdf" /></div><div class="field"><label>Policy scope</label><select><option>Retail Banking QA workspace</option><option>Selected data set</option></select></div><div class="callout">Uploaded policies enter review status. A Test Data Engineer must validate field coverage and transformations before enforcement.</div>`,action:'Upload for review',done:'Policy uploaded for review'},
      publish:{title:'Publish data-set version?',sub:'The version will become discoverable to users with access.',body:`<div class="modal-grid"><div class="modal-summary"><small>Validation</small><strong style="color:var(--green)">All required checks passed</strong></div><div class="modal-summary"><small>Privacy</small><strong style="color:var(--green)">Masking verified</strong></div></div><div class="callout purple">Publication records the version, lineage, owner and access state. You can inspect this lineage from Data sets.</div>`,action:'Publish version',done:'Data-set version published'},
      connectionTest:{title:'Connection test result',sub:'Connection and access validation.',body:`<div class="info-row"><span>Network reachability</span><strong style="color:var(--green)">Passed</strong></div><div class="info-row"><span>Authentication</span><strong style="color:var(--green)">Passed</strong></div><div class="info-row"><span>Schema preview</span><strong>12 tables · 84 fields</strong></div><div class="callout purple">Save and enable this validated connection for workspace use.</div>`,action:'Save & enable',done:'Connection saved and enabled'}
    }[kind];
    if(!cfg)return;
    const root=document.getElementById('modalRoot');
    root.innerHTML=`<div class="modal-backdrop" onclick="if(event.target===this)closeModal()"><section class="modal" role="dialog" aria-modal="true" aria-labelledby="modalTitle"><div class="modal-head"><div><div class="eyebrow">TIGR · ${esc(currentRole)}</div><h2 id="modalTitle">${cfg.title}</h2><p>${cfg.sub}</p></div><button class="modal-close" onclick="closeModal()" aria-label="Close dialog">×</button></div><div class="modal-body">${cfg.body}</div><div class="modal-foot"><button class="btn btn-quiet" onclick="closeModal()">Cancel</button><button class="btn btn-primary" onclick="modalAction('${kind}','${cfg.done}')">${cfg.action}</button></div></section></div>`;
  }
  function modalAction(kind,done){
    if(kind==='connection'){openModal('connectionTest');return;}
    if(kind==='workspace'){
      const name=document.querySelector('#modalRoot .modal-body input')?.value.trim();
      if(name){const select=document.getElementById('workspaceSelect');const option=document.createElement('option');option.textContent=name;option.value=name;select.add(option);select.value=name;}
      closeModal();notify(name?`Workspace created: ${name}`:done);return;
    }
    closeModal();notify(done);
    if(kind==='publish') goTo('datasets');
    if(kind==='reserve') goTo('reservations');
    if(kind==='grant') goTo('access');
  }
  function filterTable(){const q=(document.getElementById('tableSearch')?.value||'').toLowerCase();document.querySelectorAll('#dataTable tbody tr').forEach(r=>r.style.display=r.dataset.search.includes(q)?'':'none');}
  function filterStatus(s){document.querySelectorAll('#dataTable tbody tr').forEach(r=>r.style.display=(!s||r.dataset.status===s)?'':'none');const q=(document.getElementById('tableSearch')?.value||'').toLowerCase();if(q)filterTable();}
  document.querySelectorAll('.nav button').forEach(b=>b.addEventListener('click',()=>goTo(b.dataset.page)));
  document.getElementById('roleSelect').addEventListener('change',e=>{currentRole=e.target.value;const names={'Test Data Engineer':['Aditi Menon','AM'],'QA Engineer':['Rohan Iyer','RI'],'Admin':['Maya Rao','MR']};const [n,i]=names[currentRole];document.getElementById('sideName').textContent=n;document.getElementById('sideRole').textContent=currentRole;document.getElementById('sideAvatar').textContent=i;document.getElementById('topAvatar').textContent=i;render();});
  document.getElementById('workspaceSelect').addEventListener('change',e=>{document.querySelectorAll('.workspace-strip strong').forEach(n=>n.textContent=e.target.value);notify('Workspace changed to '+e.target.value);});
  document.getElementById('mobileMenu').addEventListener('click',()=>document.getElementById('sidebar').classList.toggle('open'));
  document.getElementById('notifications').addEventListener('click',()=>notify('You have 3 updates in this workspace'));
  render();
</script>
</body>
</html>
